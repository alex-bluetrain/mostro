name: Release

# release-please acumula los conventional commits en un "Release PR".
# Mergearlo crea el tag vX.Y.Z + el GitHub Release, y recién ahí se publica la imagen.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  # Para pushear la imagen a ghcr.io con el GITHUB_TOKEN del propio workflow.
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR / tag
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          release-type: node

  publish:
    name: Build + push a GHCR
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # GHCR se autentica con el GITHUB_TOKEN del propio workflow: no hay
      # credenciales que rotar ni federación que configurar.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # vX.Y.Z es el tag inmutable al que se le hace deploy o rollback.
          # latest existe para el pull del startup script en el primer boot.
          tags: |
            ghcr.io/${{ github.repository }}:${{ needs.release-please.outputs.tag_name }}
            ghcr.io/${{ github.repository }}:latest

      - name: Resumen
        run: |
          echo "Imagen publicada: \`ghcr.io/${{ github.repository }}:${{ needs.release-please.outputs.tag_name }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Para deployarla: correr el workflow **Deploy** con version=\`${{ needs.release-please.outputs.tag_name }}\`" >> "$GITHUB_STEP_SUMMARY"
