name: Release

# release-please accumulates the conventional commits into a "Release PR".
# Merging it creates the vX.Y.Z tag + the GitHub Release, and only then is the image published.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  # To push the image to ghcr.io with the workflow's own GITHUB_TOKEN.
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR / tag
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # The default token is secrets.GITHUB_TOKEN: no need to declare it.
      # Requires the repo switch "Allow GitHub Actions to create and approve
      # pull requests" (Settings > Actions > General); the permissions above
      # are not enough on their own.
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Gates the publish: nothing reaches GHCR with the typecheck or tests red.
  # Runs only when a release is created — on normal pushes to main the checks
  # already ran on the PR, no need to repeat them here.
  checks:
    name: Checks
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/ci.yml

  publish:
    name: Build + push to GHCR
    needs: [release-please, checks]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # GHCR authenticates with the workflow's own GITHUB_TOKEN: no
      # credentials to rotate and no federation to configure.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # vX.Y.Z is the immutable tag that gets deployed or rolled back to.
          # latest exists for the startup script's pull on first boot.
          tags: |
            ghcr.io/${{ github.repository }}:${{ needs.release-please.outputs.tag_name }}
            ghcr.io/${{ github.repository }}:latest

      - name: Summary
        run: |
          echo "Image published: \`ghcr.io/${{ github.repository }}:${{ needs.release-please.outputs.tag_name }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "To deploy it: the **Deploy** workflow runs automatically on release, or run it manually with version=\`${{ needs.release-please.outputs.tag_name }}\`" >> "$GITHUB_STEP_SUMMARY"
