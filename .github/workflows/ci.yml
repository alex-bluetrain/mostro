name: CI

# No push trigger: checks run on PRs, and release.yml calls this
# when a release is created to gate the image push to GHCR.
on:
  pull_request:
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Stops sensitive data from reaching main: prod domain, public IP, real
  # email, or the GCP project ID. The rules live in .gitleaks.toml.
  # fetch-depth: 0 so it scans the history, not just the diff.
  secrets:
    name: Gitleaks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  checks:
    name: Typecheck + unit tests
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - uses: actions/checkout@v4

      # Reads the pnpm version from the `packageManager` field in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      # *.integration.test.ts uses a real LLM (OPENROUTER_API_KEY) and is flaky: unit tests only.
      # vitest's default exclude is overridden when passing --exclude, so node_modules is listed explicitly.
      # tests/setup-env.ts already defaults MONGODB_URI to localhost:27017 (the service container).
      - run: pnpm vitest run --exclude "**/node_modules/**" --exclude "**/*.integration.test.ts"

  docker:
    name: Docker build (no push)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # No cache type=gha: exporting the pnpm install layer (~1.2GB) costs
      # more than it saves, and `mastra build` is invalidated on every commit anyway.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
