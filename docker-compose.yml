services:
  mongo:
    image: mongo:7
    container_name: mostro-server-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  mostro-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mostro-server
    # Override del CMD de la imagen: en local NO corremos `infisical run`. Los
    # secretos vienen del .env.docker (env_file), así que arrancamos node directo.
    command: ["node", "index.mjs"]
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    # Los secretos vienen del .env.docker (sin Infisical). Ese archivo ya trae
    # MONGODB_URI apuntando al servicio `mongo` y NGROK_FORWARD_ADDR al backend
    # `mostro-server:4111`, con los hostnames de la red de compose.
    env_file:
      - .env.docker
    ports:
      - "4111:4111"
    volumes:
      - mostro-data:/data

  mostro-app-web:
    build:
      context: ../mostro-app
      dockerfile: Dockerfile
      # Vars publicas inyectadas en el bundle en build time (quedan quemadas).
      # Para cambiarlas hay que rebuildear la imagen. Los valores vienen del
      # .env.docker (gitignoreado) via interpolacion de compose.
      args:
        EXPO_PUBLIC_MOSTRO_SERVER_URL: ${EXPO_PUBLIC_MOSTRO_SERVER_URL}
        EXPO_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
        # Dev-only: habilita el login mock con API key en la pantalla de auth.
        EXPO_PUBLIC_DEV_LOGIN: ${EXPO_PUBLIC_DEV_LOGIN:-1}
    container_name: mostro-app-web
    # Opt-in: solo arranca con `docker compose --profile web up`. Fuera del loop
    # diario (que corre la app con `npx expo start`), se usa para verificar el
    # artefacto web empaquetado (nginx sirviendo el export estatico).
    profiles: ["web"]
    restart: unless-stopped
    ports:
      - "8097:80"

volumes:
  mongo-data:
  mostro-data:
